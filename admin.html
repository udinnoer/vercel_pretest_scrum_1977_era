<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Peserta — Pretest/Posttest Training Scrum Master</title>
<script src="config.js"></script>
<script>
if (localStorage.getItem("scrum_admin_auth") !== "1") {
  location.href = "login.html?redirect=" + encodeURIComponent(location.pathname.split("/").pop() || "admin.html");
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#283990; --red:#E23633; --paper:#F6F5F2; --card:#FFFFFF;
    --ink:#1C1E2B; --ink-soft:#5B5F76; --line:#DEDCE8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#14162A; --card:#1D2040; --ink:#EEEFF7; --ink-soft:#A9ADC7; --line:#33365C; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:32px 16px 60px;
  }
  h1,h2,h3{font-family:Cambria,Georgia,serif; margin:0 0 6px; font-weight:700;}
  .wrap{width:100%; max-width:900px;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .mark{
    width:40px;height:40px;border-radius:50%; background:var(--navy); flex:none;
    display:flex;align-items:center;justify-content:center; color:#fff;
    font-family:Cambria,serif; font-weight:700; font-size:18px;
  }
  .top small{color:var(--ink-soft); font-size:13px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 26px;}
  .badge{
    display:inline-block; font-size:12.5px; color:var(--red); border:1px solid var(--red);
    border-radius:999px; padding:3px 12px; margin-bottom:14px;
  }
  p{line-height:1.55; color:var(--ink-soft); font-size:15px;}
  .save-note{font-size:13.5px; color:var(--ink-soft); margin:6px 0 14px;}
  .save-note.err{color:var(--red);}
  .save-note.ok{color:#2E8B57;}
  input[type=text], input[type=date], select{
    padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); font-size:15px;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus{outline:2px solid var(--navy); border-color:var(--navy);}
  button.primary{
    padding:12px 20px; border:none; border-radius:12px; background:var(--red);
    color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  button.primary:disabled{opacity:.4; cursor:not-allowed;}
  button.ghost{
    background:transparent; border:1.5px solid var(--line); color:var(--ink);
    border-radius:12px; padding:12px 20px; font-size:15px; cursor:pointer;
  }
  button.small{padding:7px 12px; font-size:13px; border-radius:9px;}
  .link-btn{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:0;}
  a.link-btn{text-decoration:none;}
  a.link-btn:hover{text-decoration:underline;}
  .actions{display:flex; gap:10px; margin-top:20px;}

  /* Elemen tambahan admin/dashboard — memakai token warna & bentuk yang sama seperti index.html */
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 26px; margin-bottom:24px; }

  table.recap{width:100%; border-collapse:collapse; font-size:13px; margin-top:14px;}
  table.recap th,table.recap td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line);}
  table.recap th{color:var(--ink-soft); font-weight:600;}
  table.recap tbody tr:hover{background:rgba(40,57,144,.04);}

  .summary-grid{display:flex; gap:10px; margin:16px 0; flex-wrap:wrap;}
  .summary-box{flex:1; min-width:120px; background:rgba(40,57,144,.06); border-radius:12px; padding:14px; text-align:center;}
  .summary-box .n{font-family:Cambria,serif; font-size:22px; font-weight:700; color:var(--navy);}
  .summary-box .l{font-size:12px; color:var(--ink-soft);}

  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0;}
  .form-grid label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
  .form-grid input{width:100%;}

  .status-pill{display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft);}
  .status-pill.active{color:#2E8B57; border-color:#2E8B57; background:rgba(46,139,87,.08);}

  #progress{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-top:16px;}
  .box{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .box h3{margin:0 0 6px; font-size:14px; color:var(--ink);}
  .box p{margin:0; font-size:13px; color:var(--ink-soft);}
  .box .val{font-family:Cambria,serif; font-size:26px; font-weight:700; color:var(--navy); margin-top:10px;}

  #timer{font-variant-numeric:tabular-nums; color:var(--red); font-size:14px; font-family:Calibri,sans-serif; font-weight:normal;}
  @keyframes pulse{50%{opacity:0.5;}}
  .live{animation:pulse 1s ease-in-out infinite;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="mark">SM</div>
    <div>
      <div style="font-size:14px;font-weight:700;">Rekap Peserta <a href="index.html" class="link-btn" style="margin-left:10px;font-size:12px;">Kembali</a> <a href="dashboard.html" class="link-btn" style="margin-left:6px;font-size:12px;">Dashboard</a> <a href="kelompok.html" class="link-btn" style="margin-left:6px;font-size:12px;">Kelompok</a> <a href="#" id="logoutLink" class="link-btn" style="margin-left:6px;font-size:12px;">Logout</a></div>
      <small>Training Scrum Master — Tim IT</small>
    </div>
  </div>

  <div class="panel" id="eventPanel">Memuat data event…</div>

  <div class="card" id="app">Memuat rekap peserta…</div>
</div>

<script>
const sb = (typeof SUPABASE_URL !== "undefined" && SUPABASE_URL.indexOf("GANTI_DENGAN") === -1)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const app = document.getElementById("app");
const eventPanel = document.getElementById("eventPanel");
let events = [];
let selectedEventId = "__all__"; // "__all__" | "__none__" (tanpa event) | <uuid>

document.getElementById("logoutLink").addEventListener("click", (e)=>{
  e.preventDefault();
  localStorage.removeItem("scrum_admin_auth");
  location.href = "login.html";
});

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("id-ID", {day:"numeric", month:"short", year:"numeric"});
}
function csvEscape(v){
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

async function loadEvents(){
  const { data, error } = await sb.from("events").select("*").order("start_date", { ascending:false });
  events = data || [];
  renderEventPanel();
  renderRecap();
}

function renderEventPanel(){
  const rows = events.map(ev => `
    <tr>
      <td>${ev.title}</td>
      <td>${ev.speaker}</td>
      <td>${fmtDate(ev.start_date)}${ev.end_date && ev.end_date!==ev.start_date ? " – " + fmtDate(ev.end_date) : ""}</td>
      <td><span class="status-pill ${ev.is_active?'active':''}">${ev.is_active?'Aktif':'Nonaktif'}</span></td>
      <td>${ev.is_active
          ? `<button class="ghost small" data-deactivate="${ev.id}">Nonaktifkan</button>`
          : `<button class="primary small" data-activate="${ev.id}">Jadikan Aktif</button>`}</td>
    </tr>
  `).join("");

  eventPanel.innerHTML = `
    <span class="badge">Kelola Event</span>
    <h2>Event Training</h2>
    <p>Tambah event baru, lalu klik "Jadikan Aktif" supaya peserta bisa mulai Pretest/Posttest untuk event tersebut di index.html. Hanya 1 event yang boleh aktif dalam satu waktu.</p>
    <div class="form-grid">
      <div><label>Judul Event *</label><input type="text" id="evTitle" placeholder="Training Scrum Master Batch 5"></div>
      <div><label>Pembicara *</label><input type="text" id="evSpeaker" placeholder="Nama pembicara"></div>
      <div><label>Tanggal Mulai *</label><input type="date" id="evStart"></div>
      <div><label>Tanggal Akhir *</label><input type="date" id="evEnd"></div>
    </div>
    <div class="save-note err" id="evError" style="display:none;"></div>
    <button class="primary" id="evSaveBtn">Simpan Event</button>

    ${events.length ? `
    <table class="recap" style="margin-top:22px;">
      <thead><tr><th>Judul</th><th>Pembicara</th><th>Periode</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : `<p style="margin-top:16px;">Belum ada event. Tambahkan event pertama di atas.</p>`}
  `;

  document.getElementById("evSaveBtn").addEventListener("click", saveEvent);
  eventPanel.querySelectorAll("[data-activate]").forEach(btn=>{
    btn.addEventListener("click", ()=> setActiveEvent(btn.getAttribute("data-activate")));
  });
  eventPanel.querySelectorAll("[data-deactivate]").forEach(btn=>{
    btn.addEventListener("click", ()=> setActiveEvent(null));
  });
}

async function saveEvent(){
  const errEl = document.getElementById("evError");
  errEl.style.display = "none";
  const title = document.getElementById("evTitle").value.trim();
  const speaker = document.getElementById("evSpeaker").value.trim();
  const start = document.getElementById("evStart").value;
  const end = document.getElementById("evEnd").value;

  if(!title || !speaker || !start || !end){
    errEl.textContent = "Semua field event wajib diisi.";
    errEl.style.display = "block";
    return;
  }
  if(end < start){
    errEl.textContent = "Tanggal akhir tidak boleh sebelum tanggal mulai.";
    errEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("evSaveBtn");
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const { error } = await sb.from("events").insert({ title, speaker, start_date:start, end_date:end });
  btn.disabled = false; btn.textContent = "Simpan Event";

  if(error){
    errEl.textContent = "Gagal menyimpan event, coba lagi.";
    errEl.style.display = "block";
    return;
  }
  await loadEvents();
}

async function setActiveEvent(eventId){
  // Nonaktifkan semua event dulu, baru aktifkan yang dipilih (kalau ada)
  await sb.from("events").update({ is_active:false }).eq("is_active", true);
  if(eventId){
    await sb.from("events").update({ is_active:true }).eq("id", eventId);
  }
  await loadEvents();
}

async function renderRecap(){
  app.innerHTML = `<span class="badge">Rekap Peserta</span><h2>Memuat data…</h2>`;

  let resultsQuery = sb.from("results").select("*").order("created_at", { ascending: false }).limit(1000);
  let sessionsQuery = sb.from("sessions").select("*").order("started_at", { ascending: false }).limit(1000);
  if(selectedEventId === "__none__"){
    resultsQuery = resultsQuery.is("event_id", null);
    sessionsQuery = sessionsQuery.is("event_id", null);
  } else if(selectedEventId !== "__all__"){
    resultsQuery = resultsQuery.eq("event_id", selectedEventId);
    sessionsQuery = sessionsQuery.eq("event_id", selectedEventId);
  }

  const { data: results } = await resultsQuery;
  const { data: sessions } = await sessionsQuery;

  if(!results || !sessions){
    app.innerHTML = `<span class="badge">Rekap Peserta</span><h2>Gagal memuat</h2><p>Coba muat ulang halaman ini.</p><p><a href="admin.html" class="link-btn">Muat Ulang</a></p>`;
    return;
  }

  const eventOptions = `
    <option value="__all__" ${selectedEventId==="__all__"?"selected":""}>Semua Event</option>
    ${events.map(ev=>`<option value="${ev.id}" ${selectedEventId===ev.id?"selected":""}>${ev.title}${ev.is_active?" (Aktif)":""}</option>`).join("")}
    <option value="__none__" ${selectedEventId==="__none__"?"selected":""}>Data Tanpa Event (sebelum fitur event)</option>
  `;

  const pre = results.filter(r=>r.mode==="pre");
  const post = results.filter(r=>r.mode==="post");
  const avg = list => list.length ? (list.reduce((a,r)=>a+r.score,0)/list.length).toFixed(1) : "-";

  const attendanceRows = pre.map((r,i)=>
    `<tr>
      <td>${i+1}</td><td>${r.nama}</td><td>${r.nik}</td><td>${r.divisi}</td><td>${r.created_at}</td>
    </tr>`
  ).join("");

  const resultRows = results.map(r=>
    `<tr>
      <td>${r.nama}</td><td>${r.nik}</td><td>${r.divisi}</td><td>${r.mode==="pre"?"Pre":"Post"}</td>
      <td>${r.score}/${r.total}</td><td>${r.created_at}</td>
    </tr>`
  ).join("");

  const inProgress = sessions.filter(s => s.status === "in_progress");
  const sessionRows = sessions.map(s=>
    `<tr>
      <td>${s.nama}</td><td>${s.nik}</td><td>${s.divisi}</td><td>${s.mode==="pre"?"Pre":"Post"}</td>
      <td>${s.status==="in_progress"?"Sedang Mengerjakan":"Selesai"}</td><td>${s.started_at}</td>
    </tr>`
  ).join("");

  app.innerHTML = `
    <span class="badge">Rekap Peserta</span>
    <h2>Hasil Keseluruhan</h2>
    <div class="form-grid" style="max-width:360px; margin-top:12px;">
      <div><label>Tampilkan data untuk event:</label>
        <select id="eventFilter">${eventOptions}</select>
      </div>
    </div>
    <div class="summary-grid">
      <div class="summary-box"><div class="n">${pre.length}</div><div class="l">Mengisi Pretest</div></div>
      <div class="summary-box"><div class="n">${post.length}</div><div class="l">Mengisi Posttest</div></div>
      <div class="summary-box"><div class="n">${avg(pre)}</div><div class="l">Rata² Pretest</div></div>
      <div class="summary-box"><div class="n">${avg(post)}</div><div class="l">Rata² Posttest</div></div>
    </div>

    ${inProgress.length > 0 ? `
    <h3 style="margin-top:24px;">Sedang Mengerjakan (${inProgress.length})</h3>
    <table class="recap">
      <thead><tr><th>Nama</th><th>NIK</th><th>Divisi</th><th>Mode</th><th>Status</th><th>Mulai</th></tr></thead>
      <tbody>${sessionRows}</tbody>
    </table>` : ""}

    <h3 style="margin-top:24px;">Daftar Hadir / Peserta Terdaftar (${pre.length})</h3>
    <p style="margin:0 0 8px;">Peserta yang sudah mengisi Pretest — otomatis tercatat sebagai peserta training yang hadir.</p>
    <table class="recap">
      <thead><tr><th>No</th><th>Nama</th><th>NIK</th><th>Divisi</th><th>Waktu Absen</th></tr></thead>
      <tbody>${attendanceRows}</tbody>
    </table>

    <h3 style="margin-top:24px;">Hasil Lengkap (${results.length})</h3>
    <table class="recap">
      <thead><tr><th>Nama</th><th>NIK</th><th>Divisi</th><th>Mode</th><th>Skor</th><th>Waktu</th></tr></thead>
      <tbody>${resultRows}</tbody>
    </table>
    <div class="actions">
      <button class="ghost" id="exportAttendanceBtn">Export Daftar Hadir</button>
      <button class="ghost" id="exportBtn">Export Hasil Lengkap</button>
    </div>
  `;
  document.getElementById("eventFilter").addEventListener("change", (e)=>{
    selectedEventId = e.target.value;
    renderRecap();
  });
  document.getElementById("exportBtn").addEventListener("click", ()=> exportCsv(results));
  document.getElementById("exportAttendanceBtn").addEventListener("click", ()=> exportAttendance(pre));
}

function exportAttendance(rows){
  const header = ["No","Nama","NIK","Divisi/Posisi","Waktu Absen"];
  const lines = [header.join(",")];
  rows.forEach((r,i)=>{
    lines.push([i+1, csvEscape(r.nama), csvEscape(r.nik), csvEscape(r.divisi), csvEscape(r.created_at)].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `daftar-hadir-scrum-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCsv(rows){
  const header = ["Nama","NIK","Divisi/Posisi","Mode","Skor","Total","Jawaban","Waktu"];
  const lines = [header.join(",")];
  rows.forEach(r=>{
    lines.push([csvEscape(r.nama), csvEscape(r.nik), csvEscape(r.divisi), csvEscape(r.mode==="pre"?"Pretest":"Posttest"),
                csvEscape(r.score), csvEscape(r.total), csvEscape(r.answers), csvEscape(r.created_at)].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `rekap-hasil-scrum-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

if(!sb){
  eventPanel.style.display = "none";
  app.innerHTML = `<span class="badge">Konfigurasi Tidak Ditemukan</span><h2>Tidak dapat terhubung ke database</h2><p>Periksa variabel SUPABASE_URL dan SUPABASE_ANON_KEY di file config.js.</p>`;
} else {
  loadEvents();
}
</script>
</body>
</html>
